[project]
name = "polityk-pipeline"
version = "0.0.1"
description = "Python ML + scraping pipeline for polityk (Guatemala 2027 election forecast)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "camelot-py>=1.0",
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-openpyxl>=3.1",
  "types-PyYAML>=6.0",
]
# Live-API deps for the social scrapers (telethon for Telegram, atproto for
# Bluesky). Kept optional because the unit tests don't touch the live APIs;
# install with `uv sync --extra social` when running the scrapers against
# real channels / firehose.
social = [
  "telethon>=1.36",
  "atproto>=0.0.50",
]
# Sentiment NER stack — heavy, kept optional. Install with `uv sync --extra sentiment`
# and `python -m spacy download es_core_news_sm`. The entity resolver runs
# gazetteer-only when these aren't available.
sentiment = [
  "spacy>=3.7,<4.0",
]
# PDF-table extractors (CID Gallup, Memoria Electoral). Kept optional so
# the lighter scraping/scoring layers don't drag in pdfminer.
parsers = [
  "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline"]
exclude = [
  # Fixture builder uses reportlab which isn't a project dep; the
  # generated PDF is what tests consume.
  "pipeline/parsers/fixtures/build_cid_gallup_fixture\\.py$",
]

# Optional-extras imports — only installed under specific extras
# (`--extra sentiment`, `--extra social`). The pipeline guards each behind
# a lazy import + helpful error message, so mypy can ignore them in the
# baseline install.
[[tool.mypy.overrides]]
module = [
    "spacy",
    "spacy.*",
    "telethon",
    "telethon.*",
    "atproto",
    "atproto.*",
    "pysentimiento",
    "pysentimiento.*",
]
ignore_missing_imports = true
